name: Build ChromaZ Multi-Platform Installers

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # 1. LINUX (.deb) BUILD IN DEBIAN TRIXIE DOCKER
  # -------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Determine Version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV
        echo "Building version: ${VER}"

    - name: Create Linux Build Script
      run: |
        cat << 'EOF' > build_deb.sh
        #!/bin/bash
        set -e
        VER="$1"

        apt-get update
        apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6widgets6 libqt6gui6 libqt6core6 \
                           qt6-speech-dev qt6-speech-speechd-plugin speech-dispatcher libqt6printsupport6 \
                           cmake make build-essential librsvg2-bin ca-certificates

        rsvg-convert -f png -w 256 -h 256 src/app.svg -o chromaz.png

        cmake -B build-linux -S src -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$VER"
        cmake --build build-linux -j$(nproc)
        QT_QPA_PLATFORM=offscreen ctest --test-dir build-linux --output-on-failure

        PKG_DIR="ChromaZ_Linux_Install_${VER}_amd64"
        mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/pixmaps"

        cat << CONTROL_EOF | sed 's/^        //' > "$PKG_DIR/DEBIAN/control"
        Package: chromaz
        Version: ${VER}
        Section: science
        Priority: optional
        Architecture: amd64
        Depends: libqt6widgets6 (>= 6.0.0), libqt6gui6 (>= 6.0.0), libqt6core6 (>= 6.0.0), libqt6texttospeech6 (>= 6.0.0), libqt6printsupport6 (>= 6.0.0), qt6-speech-speechd-plugin, speech-dispatcher, libc6 (>= 2.27)
        Maintainer: Pawel Zayakin <pz@magisters.net>
        Description: Sanger Chromatogram Alignment and Contig Viewer
         ChromaZ allows viewing Sanger AB1 chromatograms, sequence alignment,
         and contig visualization with interactive editing.
        CONTROL_EOF

        cat << 'DESKTOP_EOF' | sed 's/^        //' > "$PKG_DIR/usr/share/applications/chromaz.desktop"
        [Desktop Entry]
        Name=ChromaZ
        Comment=Sanger Chromatogram Alignment Viewer
        Exec=/usr/bin/ChromaZ
        Icon=chromaz
        Terminal=false
        Type=Application
        Categories=Science;Biology;
        DESKTOP_EOF

        cp build-linux/ChromaZ "$PKG_DIR/usr/bin/"
        cp chromaz.png "$PKG_DIR/usr/share/pixmaps/"
        find "$PKG_DIR" -type d -exec chmod 755 {} +
        find "$PKG_DIR" -type f -exec chmod 644 {} +
        chmod +x "$PKG_DIR/usr/bin/ChromaZ"
        dpkg-deb --root-owner-group --build "$PKG_DIR"
        EOF
        chmod +x build_deb.sh

    - name: Run Linux Build inside Debian Trixie Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie ./build_deb.sh "${{ env.APP_VERSION }}"

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ChromaZ-Linux-Installer
        path: ChromaZ_Linux_Install_${{ env.APP_VERSION }}_amd64.deb
        retention-days: 30


  # -------------------------------------------------------------------
  # 2. WINDOWS (.exe) BUILD ON WINDOWS RUNNER
  # -------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    env:
      WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Determine Version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV
        echo "Building version: ${VER}"

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtspeech qtmultimedia'

    - name: Install NSIS & Add to Path
      run: |
        choco install nsis -y
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

    - name: Configure CMake
      run: |
        cmake -B build -S src -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="${{ env.APP_VERSION }}"

    - name: Build ChromaZ
      run: |
        cmake --build build --config Release

    - name: Run unit tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        ctest --test-dir build -C Release --output-on-failure

    - name: Deploy Qt Libraries
      shell: bash
      run: |
        mkdir -p win
        cp build/Release/ChromaZ.exe win/
        windeployqt win/ChromaZ.exe

    - name: Sign ChromaZ.exe (if a certificate is configured)
      if: ${{ env.WIN_CERT_PFX_BASE64 != '' }}
      shell: pwsh
      run: |
        $pfx = Join-Path$env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))$signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
        & $signtool sign /f $pfx /p$env:WIN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 win\ChromaZ.exe
        if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
        Remove-Item $pfx

    - name: Build Installer
      shell: bash
      run: |
        makensis -DAPP_VERSION="${{ env.APP_VERSION }}" src/installer.nsi
        mv ChromaZ_Setup.exe ChromaZ_Windows_Install_${{ env.APP_VERSION }}.exe

    - name: Sign installer (if a certificate is configured)
      if: ${{ env.WIN_CERT_PFX_BASE64 != '' }}
      shell: pwsh
      run: |
        $pfx = Join-Path$env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))$signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
        & $signtool sign /f $pfx /p$env:WIN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "ChromaZ_Windows_Install_${{ env.APP_VERSION }}.exe"
        if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
        Remove-Item $pfx

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ChromaZ-Windows-Installer
        path: ChromaZ_Windows_Install_${{ env.APP_VERSION }}.exe
        retention-days: 30

    # -----------------------------------------------------------------
    # Сборка и авто-публикация пакета Chocolatey (без выгрузки в GitHub Release)
    # -----------------------------------------------------------------
    - name: Build & Publish Chocolatey Package
      if: startsWith(github.ref, 'refs/tags/') && env.CHOCO_API_KEY != ''
      shell: pwsh
      run: |
        $ver = "${{ env.APP_VERSION }}"
        $chocoVer =$ver.Replace("-", ".")
        $installer = "ChromaZ_Windows_Install_${ver}.exe"

        # 1. Вычисляем хэш собранного Windows-инсталлятора
        $hash = (Get-FileHash$installer -Algorithm SHA256).Hash
        Write-Host "Installer SHA256: $hash"

        # 2. Формируем прямой URL к релизному .exe
        $tag = "${{ github.ref_name }}"
        if (-not $tag.StartsWith("v")) { $tag = "v" + $ver }$url = "https://github.com/zajakin/ChromaZ/releases/download/$tag/$installer"

        # 3. Подставляем реальные значения в шаблоны
        $nuspec = "chocolatey/chromaz.nuspec"
        $installScript = "chocolatey/tools/chocolateyInstall.ps1"

        (Get-Content $nuspec -Raw) -replace '[[VERSION]]', $chocoVer \vert{} Set-Content$nuspec -Encoding UTF8
        (Get-Content $installScript -Raw) `
            -replace '\[\[URL64\]\]', $url `
            -replace '[[CHECKSUM]]', $hash \vert{} Set-Content$installScript -Encoding UTF8

        # 4. Собираем пакет во временный каталог
        $pkgDir = Join-Path$env:RUNNER_TEMP "choco_pkg"
        New-Item -ItemType Directory -Path $pkgDir -Force
        choco pack $nuspec --outputdirectory$pkgDir

        # 5. Отправляем в репозиторий Chocolatey
        Write-Host "Pushing package to Chocolatey..."
        choco push (Get-ChildItem (Join-Path $pkgDir "*.nupkg")).FullName --api-key $env:CHOCO_API_KEY --source https://push.chocolatey.org/


  # -------------------------------------------------------------------
  # 3. MACOS (.dmg) BUILD ON MACOS RUNNER (UNIVERSAL 2)
  # -------------------------------------------------------------------
  build-macos:
    runs-on: macos-14
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Determine Version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtspeech qtmultimedia'

    - name: "Configure CMake (Universal Binary: Intel + Apple Silicon)"
      run: |
        cmake -B build -S src \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DAPP_VERSION="${{ env.APP_VERSION }}"

    - name: Build ChromaZ
      run: |
        cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Run unit tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        ctest --test-dir build -C Release --output-on-failure

    - name: Bundle Qt Frameworks
      run: |
        APP_PATH=$(find build -name "ChromaZ.app" -type d | head -n 1)
        echo "Found bundle at: $APP_PATH"
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        $QT_ROOT_DIR/bin/macdeployqt "$APP_PATH"

    - name: Import signing certificate (if configured)
      if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/chromaz-build.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        echo "$MACOS_CERT_P12_BASE64" \vert{} base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/cert.p12"

    - name: Sign app bundle (Developer ID, hardened runtime)
      if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
      run: |
        find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 | \
          xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY"
        find "$APP_PATH/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0 | \
          xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY"
        codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$APP_PATH"
        codesign --verify --deep --strict --verbose=2 "$APP_PATH"

    - name: Create DMG
      run: |
        DMG="ChromaZ_macOS_Install_${{ env.APP_VERSION }}.dmg"
        hdiutil create -volname "ChromaZ" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG"

    - name: Sign, notarize and staple DMG (if configured)
      if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
      run: |
        DMG="ChromaZ_macOS_Install_${{ env.APP_VERSION }}.dmg"
        codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$DMG"
        if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
        else
          echo "Apple notarization credentials are not configured: the DMG is signed but not notarized."
        fi

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ChromaZ-macOS-Installer
        path: ChromaZ_macOS_Install_${{ env.APP_VERSION }}.dmg
        retention-days: 30

  # -------------------------------------------------------------------
  # 4. ЕДИНЫЙ DRAFT-РЕЛИЗ (создаётся один раз, после успешной сборки всех платформ)
  # -------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all installers
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Create draft release with all installers
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}