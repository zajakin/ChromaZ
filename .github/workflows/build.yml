name: Build ChromaZ Multi-Platform Installers

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 1. LINUX (.deb) BUILD IN DEBIAN DOCKER
  # -------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Determine Version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV
        echo "Building version: ${VER}"

    - name: Create Linux Build Script
      run: |
        cat << 'EOF' > build_deb.sh
        #!/bin/bash
        set -e
        VER="$1"

        apt-get update
        apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6widgets6 libqt6gui6 libqt6core6 \
                           cmake make build-essential librsvg2-bin imagemagick

        rsvg-convert -f png -w 256 -h 256 src/app.svg -o chromaz.png
        convert chromaz.png src/app.ico

        cmake -B build-linux -S src -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$VER"
        cmake --build build-linux -j$(nproc)

        PKG_DIR="ChromaZ_Linux_Install_${VER}_amd64"
        mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/pixmaps"

        cat << CONTROL_EOF | sed 's/^        //' > "$PKG_DIR/DEBIAN/control"
        Package: chromaz
        Version: ${VER}
        Section: science
        Priority: optional
        Architecture: amd64
        Depends: libqt6widgets6 (>= 6.0.0), libqt6gui6 (>= 6.0.0), libqt6core6 (>= 6.0.0), libc6 (>= 2.27)
        Maintainer: Pawel Zayakin <pz@magisters.net>
        Description: Sanger Chromatogram Alignment and Contig Viewer
         ChromaZ allows viewing Sanger AB1 chromatograms, sequence alignment,
         and contig visualization with interactive editing.
        CONTROL_EOF

        cat << 'DESKTOP_EOF' | sed 's/^        //' > "$PKG_DIR/usr/share/applications/chromaz.desktop"
        [Desktop Entry]
        Name=ChromaZ
        Comment=Sanger Chromatogram Alignment Viewer
        Exec=/usr/bin/ChromaZ
        Icon=chromaz
        Terminal=false
        Type=Application
        Categories=Science;Biology;
        DESKTOP_EOF

        cp build-linux/ChromaZ "$PKG_DIR/usr/bin/"
        cp chromaz.png "$PKG_DIR/usr/share/pixmaps/"
        find "$PKG_DIR" -type d -exec chmod 755 {} +
        find "$PKG_DIR" -type f -exec chmod 644 {} +
        chmod +x "$PKG_DIR/usr/bin/ChromaZ"
        dpkg-deb --root-owner-group --build "$PKG_DIR"
        EOF
        chmod +x build_deb.sh

    - name: Run Linux Build inside Debian 12 Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace debian:bookworm ./build_deb.sh "${{ env.APP_VERSION }}"

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ChromaZ-Linux-Installer
        path: ChromaZ_Linux_Install_${{ env.APP_VERSION }}_amd64.deb
        retention-days: 30

    - name: "Upload Linux to GitHub Release (on Tag)"
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ChromaZ_Linux_Install_${{ env.APP_VERSION }}_amd64.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # 2. WINDOWS (.exe) BUILD ON WINDOWS RUNNER
  # -------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Determine Version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV
        echo "Building version: ${VER}"

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Install NSIS & Add to Path
      run: |
        choco install nsis -y
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

    - name: Configure CMake
      run: |
        cmake -B build -S src -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="${{ env.APP_VERSION }}"

    - name: Build ChromaZ
      run: |
        cmake --build build --config Release

    - name: Deploy Qt Libraries & Build Installer
      shell: bash
      run: |
        mkdir -p win
        cp build/Release/ChromaZ.exe win/
        windeployqt win/ChromaZ.exe
        makensis src/installer.nsi
        find . -maxdepth 2 -name "*.exe" ! -name "ChromaZ.exe" -exec mv {} ChromaZ_Windows_Install_${{ env.APP_VERSION }}.exe \;

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ChromaZ-Windows-Installer
        path: ChromaZ_Windows_Install_${{ env.APP_VERSION }}.exe
        retention-days: 30

    - name: "Upload Windows to GitHub Release (on Tag)"
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ChromaZ_Windows_Install_${{ env.APP_VERSION }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # 3. MACOS (.dmg) BUILD ON MACOS RUNNER (UNIVERSAL 2)
  # -------------------------------------------------------------------
  build-macos:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Determine Version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'

    - name: "Configure CMake (Universal Binary: Intel + Apple Silicon)"
      run: |
        cmake -B build -S src \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DAPP_VERSION="${{ env.APP_VERSION }}"

    - name: Build ChromaZ
      run: |
        cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Bundle Qt Frameworks & Create DMG
      run: |
        APP_PATH=$(find build -name "ChromaZ.app" -type d | head -n 1)
        echo "Found bundle at: $APP_PATH"
        $QT_ROOT_DIR/bin/macdeployqt "$APP_PATH" -dmg
        find build -name "*.dmg" -exec mv {} ChromaZ_macOS_Install_${{ env.APP_VERSION }}.dmg \;

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ChromaZ-macOS-Installer
        path: ChromaZ_macOS_Install_${{ env.APP_VERSION }}.dmg
        retention-days: 30

    - name: "Upload macOS to GitHub Release (on Tag)"
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ChromaZ_macOS_Install_${{ env.APP_VERSION }}.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}