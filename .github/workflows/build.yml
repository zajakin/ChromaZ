name: Build ChromaZ Multi-Platform Installers

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 1. LINUX (.deb) & WINDOWS (.exe) BUILD ON UBUNTU RUNNER
  # -------------------------------------------------------------------
  build-linux-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine Version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV
        echo "Building version: ${VER}"

    - name: Install Build Dependencies (MinGW & NSIS)
      run: |
        sudo apt-get update
        sudo apt-get install -y nsis mingw-w64 mingw-w64-tools zstd

    # --- СБОРКА LINUX DEBIAN PACKAGE (.deb в Docker Debian 12 Bookworm) ---
    - name: Build Linux Binary & DEB Package in Debian 12 Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace debian:bookworm bash -c "
          set -e
          apt-get update
          apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6widgets6 libqt6gui6 libqt6core6 \
                             cmake make build-essential librsvg2-bin imagemagick

          rsvg-convert -f png -w 256 -h 256 src/app.svg -o chromaz.png
          convert chromaz.png src/app.ico

          cmake -B build-linux -S src -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION=\"${{ env.APP_VERSION }}\"
          cmake --build build-linux -j\$(nproc)

          VER=\"${{ env.APP_VERSION }}\"
          PKG_DIR=\"chromaz_\${VER}_amd64\"
          mkdir -p \"\$PKG_DIR/DEBIAN\" \"\$PKG_DIR/usr/bin\" \"\$PKG_DIR/usr/share/applications\" \"\$PKG_DIR/usr/share/pixmaps\"

          cat << EOF > \"\$PKG_DIR/DEBIAN/control\"
Package: chromaz
Version: \${VER}
Section: science
Priority: optional
Architecture: amd64
Depends: libqt6widgets6 (>= 6.0.0), libqt6gui6 (>= 6.0.0), libqt6core6 (>= 6.0.0), libc6 (>= 2.27)
Maintainer: Pawel Zayakin <pz@magisters.net>
Description: Sanger Chromatogram Alignment and Contig Viewer
 ChromaZ allows viewing Sanger AB1 chromatograms, sequence alignment,
 and contig visualization with interactive editing.
EOF

          cat << 'EOF' > \"\$PKG_DIR/usr/share/applications/chromaz.desktop\"
[Desktop Entry]
Name=ChromaZ
Comment=Sanger Chromatogram Alignment Viewer
Exec=/usr/bin/ChromaZ
Icon=chromaz
Terminal=false
Type=Application
Categories=Science;Biology;
EOF

          cp build-linux/ChromaZ \"\$PKG_DIR/usr/bin/\"
          cp chromaz.png \"\$PKG_DIR/usr/share/pixmaps/\"
          find \"\$PKG_DIR\" -type d -exec chmod 755 {} +
          find \"\$PKG_DIR\" -type f -exec chmod 644 {} +
          chmod +x \"\$PKG_DIR/usr/bin/ChromaZ\"
          dpkg-deb --root-owner-group --build \"\$PKG_DIR\"
        "

    # --- СБОРКА WINDOWS INSTALLER (.exe) ---
    - name: Download MinGW Qt6 Toolchain & Build Windows Installer
      run: |
        mkdir -p ~/mingw-qt6 && cd ~/mingw-qt6
        wget https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-qt6-base-6.11.2-2-any.pkg.tar.zst
        tar -I zstd -xvf mingw-w64-x86_64-qt6-base-*.pkg.tar.zst
        cd "$GITHUB_WORKSPACE"

        mkdir -p win

        cmake -B build-win -S src \
          -DCMAKE_TOOLCHAIN_FILE=src/toolchain-mingw64.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DAPP_VERSION="${{ env.APP_VERSION }}"
        cmake --build build-win -j$(nproc)

        cp build-win/ChromaZ.exe win/
        makensis src/installer.nsi

    # --- ЗАГРУЗКА АРТЕФАКТОВ СБОРКИ ---
    - name: Upload Linux & Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ChromaZ-Linux-Windows-Installers
        path: |
          chromaz_${{ env.APP_VERSION }}_amd64.deb
          ChromaZ_Setup.exe
        retention-days: 30

    - name: "Upload Linux & Windows to GitHub Release (on Tag)"
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          chromaz_${{ env.APP_VERSION }}_amd64.deb
          ChromaZ_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # 2. MACOS (.dmg) BUILD ON MACOS RUNNER (UNIVERSAL 2: INTEL + APPLE SILICON)
  # -------------------------------------------------------------------
  build-macos:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine Version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER="1.0-1"
        fi
        echo "APP_VERSION=${VER}" >> $GITHUB_ENV

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'

    - name: "Configure CMake (Universal Binary: Intel + Apple Silicon)"
      run: |
        cmake -B build -S src \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DAPP_VERSION="${{ env.APP_VERSION }}"

    - name: Build ChromaZ
      run: |
        cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Bundle Qt Frameworks & Create DMG
      run: |
        APP_PATH=$(find build -name "ChromaZ.app" -type d | head -n 1)
        echo "Found bundle at: $APP_PATH"
        $QT_ROOT_DIR/bin/macdeployqt "$APP_PATH" -dmg
        find build -name "*.dmg" -exec mv {} ChromaZ_macOS.dmg \;

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChromaZ-macOS-Installer
        path: ChromaZ_macOS.dmg
        retention-days: 30

    - name: "Upload macOS to GitHub Release (on Tag)"
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ChromaZ_macOS.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}